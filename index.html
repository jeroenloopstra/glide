<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Glide</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0369a1">

<!-- iOS home screen support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Glide">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="stylesheet" href="css/style.css">
<script>
  (function () {
    var saved = localStorage.getItem("glideTheme");
    var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
</head>
<body>

<header class="app-header">
  <button id="settingsToggle" class="icon-btn-plain header-icon-btn settings-toggle" aria-label="Settings">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
    <span id="backupBadge" class="badge-dot hidden"></span>
  </button>
  <button id="themeToggle" class="icon-btn-plain header-icon-btn theme-toggle" aria-label="Toggle dark mode">
    <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12h2.5M19 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>
  </button>
  <h1>Glide</h1>
</header>

<main id="listView" class="view">
  <div id="listToolbar" class="list-toolbar hidden">
    <select id="typeFilterSelect" class="sort-select"></select>
    <select id="sortSelect" class="sort-select">
      <option value="date">Date</option>
      <option value="pace">Pace</option>
    </select>
  </div>
  <div id="emptyState" class="empty-state hidden">
    <p id="emptyTitle" class="empty-title">No swims yet</p>
    <button id="emptyAddBtn" class="empty-cta">Tap here to log your first swim &rarr;</button>
  </div>
  <ul id="swimList" class="race-list"></ul>
  <button id="addBtn" class="fab" aria-label="Add swim">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</main>

<main id="settingsView" class="view hidden">
  <div class="detail-topbar">
    <button id="settingsBackBtn" class="icon-btn-plain" aria-label="Back">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
  </div>
  <h2 class="settings-title">Settings</h2>

  <fieldset class="segment">
    <legend>Backup</legend>
    <p id="settingsHint" class="settings-hint">Export your swim data to a file you can keep safe, or restore it on this or another device.</p>
    <div class="settings-actions">
      <button type="button" id="exportBtn" class="btn btn-secondary">Export data</button>
      <button type="button" id="importBtn" class="btn btn-secondary">Import data</button>
    </div>
    <input type="file" id="importFileInput" accept="application/json" class="visually-hidden">
  </fieldset>
</main>

<main id="detailView" class="view hidden">
  <div class="detail-topbar">
    <button id="backBtn" class="icon-btn-plain" aria-label="Back">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
  </div>
  <div id="detailContent"></div>
</main>

<main id="formView" class="view hidden">
  <form id="swimForm" novalidate>
    <div class="detail-header form-title-row">
      <h2 id="formTitle">New Swim</h2>
    </div>

    <label class="field">
      <span>Type</span>
      <select id="typeInput" required></select>
    </label>

    <label class="field">
      <span>Date</span>
      <div class="date-input-wrap">
        <input type="date" id="dateInput">
        <svg class="date-input-icon" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      </div>
    </label>

    <label class="field">
      <span>Distance (m)</span>
      <input type="number" id="distanceInput" required min="0" step="any" inputmode="decimal" placeholder="e.g. 2000">
    </label>

    <fieldset class="segment">
      <legend>Pool</legend>
      <label class="subfield">
        <span>Length</span>
        <select id="poolLengthSelect">
          <option value="25">25 m</option>
          <option value="50">50 m</option>
          <option value="custom">Other...</option>
        </select>
      </label>
      <label class="subfield hidden" id="poolLengthCustomWrap">
        <span>Custom length (m)</span>
        <input type="number" id="poolLengthCustomInput" min="0" step="any" inputmode="decimal">
      </label>
      <label class="subfield">
        <span>Name</span>
        <input type="text" id="poolNameInput" list="poolNames" placeholder="e.g. Sportfondsenbad" autocomplete="off">
        <datalist id="poolNames"></datalist>
      </label>
    </fieldset>

    <fieldset class="segment">
      <legend>Total time</legend>
      <div class="time-input" data-target="totalTime">
        <span>Time</span>
        <div class="hms">
          <input type="number" min="0" max="59" placeholder="hh" class="h">
          <span>:</span>
          <input type="number" min="0" max="59" placeholder="mm" class="m">
          <span>:</span>
          <input type="number" min="0" max="59" placeholder="ss" class="s">
        </div>
        <div class="pace-display" id="totalPaceDisplay"></div>
      </div>
    </fieldset>

    <fieldset class="segment">
      <legend>Movement time</legend>
      <p class="segment-hint">Time actually swimming, excluding rest between sets.</p>
      <div class="time-input" data-target="movementTime">
        <span>Time</span>
        <div class="hms">
          <input type="number" min="0" max="59" placeholder="hh" class="h">
          <span>:</span>
          <input type="number" min="0" max="59" placeholder="mm" class="m">
          <span>:</span>
          <input type="number" min="0" max="59" placeholder="ss" class="s">
        </div>
        <div class="pace-display" id="movementPaceDisplay"></div>
      </div>
    </fieldset>

    <div class="form-actions">
      <button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</main>

<div id="toast" class="toast" role="alert" aria-live="assertive"></div>

<script src="js/db.js"></script>
<script src="js/app.js"></script>
</body>
</html>
